name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0"

          # Delete existing release if present, then recreate
          gh release delete "$TAG" --yes 2>/dev/null || true

          # Create the release and upload the asset
          gh release create "$TAG" \
            --title "DriveOne Design System" \
            --notes "DriveOne video assets" \
            --latest \
            snap-tap-done.mp4
