<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DriveOne Design System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 32px 16px;
      width: 100%;
      max-width: 900px;
    }

    h1 {
      color: #ffffff;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      text-align: center;
    }

    video {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
      background: #000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>DriveOne Design System</h1>
    <video
      src="https://cdn.jsdelivr.net/gh/InsureifyRyan/driveone-design-system@main/snap-tap-done.mp4"
      controls
      playsinline
    >
      Your browser does not support the video tag.
    </video>
  </div>
</body>
</html>
