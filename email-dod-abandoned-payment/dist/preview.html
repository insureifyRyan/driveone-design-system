px\"><div style=\"font-family:Helvetica, Arial, sans-serif;font-weight:700;font-size:27px;line-height:1.25;color:#0E1B2C;letter-spacing:-0.02em\">Every part of car ownership<br>has a price tag.<br>Except the repair.</div></td></tr>\n  <tr><td style=\"padding-top:16px;padding-bottom:0px;padding-left:32px;padding-right:32px\"><div style=\"font-family:Helvetica, Arial, sans-serif;font-weight:400;font-size:15px;line-height:1.65;color:#3D4A5C;\">You know the payment. You know the insurance. You know roughly what gas costs, because you have been angry about it.</div></td></tr><tr><td style=\"padding-top:14px;padding-bottom:0px;padding-left:32px;padding-right:32px\"><div style=\"font-family:Helvetica, Arial, sans-serif;font-weight:400;font-size:15px;line-height:1.65;color:#3D4A5C;\">The one number you do not know is the repair. It shows up at a time of its own choosing, with a figure of its own choosing, and it does not take questions.</div></td></tr>\n  <tr><td style=\"padding-top:22px;padding-bottom:0px;padding-left:32px;padding-right:32px\">\n    <div style=\"font-family:Helvetica, Arial, sans-serif;font-weight:700;font-size:10px;line-height:1;color:#0E1B2C;letter-spacing:0.16em;padding-bottom:10px\">WITH YOUR PLAN ACTIVE</div>\n    <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" bgcolor=\"#F4F6F9\" style=\"background-color:#F4F6F9;border-radius:14px\"><tr><td valign=\"top\" style=\"padding:13px 12px 13px 18px;border-bottom:1px solid #E3E8EF;\"><div style=\"font-family:Helvetica, Arial, sans-serif;font-weight:400;font-size:14px;line-height:1.45;color:#3D4A5C\">You pay</div></td><td valign=\"top\" align=\"right\" style=\"padding:13px 18px 13px 0;border-bottom:1px solid #E3E8EF;\"><div style=\"font-family:'SF Mono', Menlo, Consolas, 'Courier New', monospace;font-weight:700;font-size:13px;line-height:1.45;color:#0E1B2C\">$100 per visit</div></td></tr><tr><td valign=\"top\" style=\"padding:13px 12px 13px 18px;border-bottom:1px so nt-size:14px;\">Reminder: coverage is not active until the payment goes through. The contract is written. It is not working yet.</div></td></tr></table></td></tr>\n  <tr><td style=\"height:30px;font-size:0;line-height:0\">&nbsp;</td></tr>\n\n  <tr><td bgcolor=\"#0E1B2C\" style=\"background-color:#0E1B2C;padding:26px 32px\">\n    <div style=\"font-family:Helvetica, Arial, sans-serif;font-weight:700;font-size:13px;line-height:1.5;color:#FFFFFF;padding-bottom:4px\">Stuck on the payment step?</div>\n    <div style=\"font-family:Helvetica, Arial, sans-serif;font-weight:400;font-size:13px;line-height:1.6;color:#A9BACB\">Call Budco Financial Services, who run the 0% plan, at <a href=\"tel:18883527901\" style=\"color:#1FBFEC;text-decoration:none;font-weight:700\">888-352-7901</a>. Coverage or claims questions go to Ascent, the administrator, at <a href=\"tel:18666607003\" style=\"color:#1FBFEC;text-decoration:none;font-weight:700\">866-660-7003</a>. Neither will sell you anything.</div>\n  </td></tr>\n  <tr><td bgcolor=\"#EEF2F6\" style=\"background-color:#EEF2F6;padding:22px 32px 30px\">\n    <div style=\"font-family:Helvetica, Arial, sans-serif;font-weight:400;font-size:11px;line-height:1.65;color:#8A99B5\">This is an advertisement. A vehicle service contract is not insurance and is not a manufacturer's warranty. Coverage is administered by Ascent Administration Services, LLC and insured by Old Republic Insurance Company (A+ rated by AM Best). Not available in California. Coverage, price and terms vary by state and are subject to limits and exclusions; see your contract for the complete list of covered components and exclusions. Coverage is not active until your payment is completed. Payment amounts shown are from the contract you signed; your exact terms are confirmed by Budco Financial Services at checkout. A $100 deductible applies per visit. Cancel anytime: full refund within 30 days if no claim has been paid; prorated after, less any paid claims and a cancellation fee where permitted by your state. Questions about coverage or claims? Call the administrator, Ascent, at 866-660-7003.</div>\n    <div style=\"font-family:Helvetica, Arial, sans-serif;font-weight:400;font-size:11px;line-height:1.65;color:#8A99B5;padding-top:12px\">Insureify AI, Inc. DBA Kovara AI &middot; 304 South Jones Blvd, Las Vegas, NV 89107</div>\n    <div style=\"font-family:Helvetica, Arial, sans-serif;font-weight:400;font-size:11px;line-height:1.65;color:#8A99B5;padding-top:10px\"><a href=\"https://www.driveonedirect.com/privacy\" style=\"color:#8A99B5\">Privacy</a> &middot; <a href=\"https://www.driveonedirect.com/terms\" style=\"color:#8A99B5\">Terms</a> &middot; <a href=\"https://www.driveonedirect.com/#unsubscribe\" style=\"color:#8A99B5\">Unsubscribe</a></div>\n    <div style=\"font-family:Helvetica, Arial, sans-serif;font-weight:400;font-size:11px;line-height:1.65;color:#8A99B5;padding-top:10px\">Contract ELVVSC2610051204 &middot; Reference 20261012-f1ddc214</div>\n  </td></tr>\n</table>\n</td></tr></table>\n</body></html>"},{"step":5,"subject":"You pick the shop. We pay the shop.","subjectAlt":"No, you do not have to drive it back to where you bought it","preheader":"Any ASE-certified repair shop in the country. Your mechanic counts.","html":"<!DOCTYPE html>\n<html><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n<meta name=\"x-apple-disable-message-reformatting\"><title>DriveOne Direct</title></head>\n<body style=\"margin:0;padding:0;background-color:#EEF2F6\">\n<div style=\"display:none;font-size:1px;color:#EEF2F6;line-height:1px;max-height:0px;max-width:0px;opacity:0;overflow:hidden\">Any ASE-certified repair shop in the country. Your mechanic counts.&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;
